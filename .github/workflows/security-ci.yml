name: LLM Security CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-tests:
    name: Python and Security Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify dependencies
        run: python -m pip check

      - name: Validate Python syntax
        run: python -m compileall -q app guardrails evaluation tests

      - name: Execute automated security tests
        run: python -m pytest -q

      - name: Run red-team evaluation
        run: python -m evaluation.run_evaluation

      - name: Verify red-team decisions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("evidence/test-results/red-team-results.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          summary = report["summary"]

          assert len(report["results"]) == 13
          assert summary["true_positives"] == 10
          assert summary["false_negatives"] == 0
          assert summary["false_positives"] == 0

          print("Known red-team evaluation: PASSED")
          print("Attacks blocked: 10/10")
          PY
